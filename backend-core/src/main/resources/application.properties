# Nạp cấu hình bảo mật cục bộ nếu có (application-local.properties nằm trong .gitignore)
spring.config.import=optional:classpath:application-local.properties

# Cấu hình Database Supabase (Hỗ trợ biến môi trường hoặc application-local.properties)
# prepareThreshold=0: Supabase pooler cổng 6543 chạy transaction mode, không giữ được
# server-side prepared statement -> thiếu tham số này sẽ lỗi 'prepared statement "S_x" already exists'
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-ap-southeast-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema do Flyway quản lý (src/main/resources/db/migration); Hibernate chỉ kiểm tra khớp entity.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
# Không giữ session Hibernate suốt request: mọi truy cập DB nằm trong service @Transactional và trả DTO.
spring.jpa.open-in-view=false

# DB đang có dữ liệu (tạo trước khi có Flyway) -> đánh dấu V1__baseline là đã chạy thay vì chạy lại.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
# Kết nối riêng cho migration (xem MigrationConfig). Rỗng = dùng chung datasource.
# Supabase: dùng session pooler cổng 5432 vì pooler 6543 (transaction mode) không giữ được lock phiên.
app.migration.url=${MIGRATION_DB_URL:}

server.port=8080

# Bóc tách tài liệu (docs/EXTRACTION.md): ai-service FastAPI; key nội bộ (tuỳ chọn) khớp AI_SERVICE_KEY bên Python.
app.ai-service.url=${AI_SERVICE_URL:http://localhost:8000}
app.ai-service.key=${AI_SERVICE_KEY:}
# OCR + phân tích tài liệu dài có thể mất vài phút (ISO-8601)
app.ai-service.read-timeout=${AI_SERVICE_READ_TIMEOUT:PT3M}
# Số lượt bóc tách mỗi tài khoản trong 24 giờ: bảng app_settings (Admin Panel > Cấu hình), không còn là property
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=16MB
# Lộ trình học tập: múi giờ tính "hôm nay" khi client không gửi ?date=
app.learning-path.zone=Asia/Ho_Chi_Minh

# Chạy sau reverse proxy (Nginx, Cloudflare...): lấy IP thật từ X-Forwarded-For cho bộ đếm chống dò mật khẩu /
# chặn tạo tài khoản hàng loạt. "native" = Tomcat RemoteIpValve: CHỈ tin header khi request đến từ proxy
# mạng nội bộ (10.x, 192.168.x, 172.16-31.x, 127.x) -> client từ Internet không giả được IP.
# Proxy có IP công khai: khai báo thêm server.tomcat.remoteip.internal-proxies (regex IP của proxy).
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:native}

# Quên mật khẩu: link trong email trỏ về frontend
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.mail.from=${MAIL_FROM:no-reply@nihongen.local}
# SMTP: KHÔNG đặt spring.mail.host ở đây (đặt rỗng vẫn bật mail sender -> gửi lỗi). Khai báo khi có SMTP:
#   SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD (+ spring.mail.properties.mail.smtp.starttls.enable=true)
# Chưa có SMTP: link đặt lại mật khẩu được ghi vào log backend (chỉ dùng khi dev).

# Tạo tài khoản: tối đa N lần mỗi IP trong cửa sổ thời gian (ISO-8601, PT1H = 1 giờ)
app.rate-limit.register.max=${REGISTER_RATE_MAX:30}
app.rate-limit.register.window=${REGISTER_RATE_WINDOW:PT1H}

# JWT: KHÔNG có giá trị mặc định -> thiếu JWT_SECRET (hoặc jwt.secret trong application-local.properties)
# thì app không khởi động, thay vì chạy với secret ai cũng biết. Tối thiểu 64 byte (HS512).
jwt.secret=${JWT_SECRET}
# Access token ngắn hạn (15 phút); refresh token hạn trượt 3 ngày: không vào web quá 3 ngày thì phải đăng nhập lại
jwt.expiration=${JWT_EXPIRATION_MS:900000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:P3D}

# CORS: danh sách origin phân tách bằng dấu phẩy
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Swagger tắt mặc định (môi trường triển khai); bật ở máy dev qua application-local.properties
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

