# DataSource do @AutoConfigureEmbeddedDatabase (Postgres nhúng) cung cấp -> không chạm Supabase.
# Flyway chạy toàn bộ migration trên DB nhúng; ddl-auto=validate (mặc định) kiểm entity khớp migration.
spring.jpa.show-sql=false
# Không dùng kết nối migration Supabase trong application-local.properties
app.migration.url=

# Secret chỉ dùng cho test, không dùng ở môi trường thật
jwt.secret=test-only-secret-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

# Đếm số câu SQL trong test hiệu năng (DeckPerformanceIT)
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.engine.internal.StatisticalLoggingSessionEventListener=WARN

# Mọi test tích hợp đăng ký từ cùng IP 127.0.0.1: nới giới hạn (RegisterRateLimitIT tự đặt ngưỡng thấp)
app.rate-limit.register.max=100000

app.ai-service.url=http://ai-service.invalid:8000

# Tắt cron nhắc học (LearningPathReminderJob, phút 05 mỗi giờ): chạy thật giữa một IT sẽ đánh dấu / nhắc lộ trình của test.
# LearningPathReminderJobIT gọi thẳng run(now, today) với mốc giờ cố định.
app.learning-path.reminder-cron=-
