# Profile cho smoke test (npm run e2e): backend thật + Postgres nhúng mới tinh mỗi lần chạy.
# Chạy bằng goal spring-boot:test-run để E2eDatabaseConfig (src/test) nằm trên classpath.
spring.jpa.show-sql=false
app.migration.url=
# Chốt an toàn: nếu E2eDatabaseConfig không được nạp, Hikari trỏ vào địa chỉ chết -> app không lên,
# thay vì âm thầm ghi dữ liệu test vào Supabase.
spring.datasource.url=jdbc:postgresql://e2e-guard.invalid:5432/none

# Secret chỉ dùng cho test, không dùng ở môi trường thật
jwt.secret=test-only-secret-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
