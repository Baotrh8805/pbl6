# Từ đồng tự dị âm (B5): cùng chữ viết, cách đọc đổi theo nghĩa / ngữ cảnh. Sudachi gần như luôn cho MỘT cách đọc
# mỗi lemma (開い luôn là ひらい, 辛かっ luôn là つらかっ, 抱い luôn là いだい) nên câu "ドアが開いている", "カレーが辛い",
# "子供を抱いて" nhận furigana sai. Bảng này chỉ đổi cách đọc khi ngữ cảnh có DẤU HIỆU (cue) của một cách đọc khác;
# không cue nào khớp, hoặc hai cách đọc khớp ngang nhau → giữ cách đọc Sudachi (heteronyms.resolve).
#
# Cú pháp:
#   term: dạng từ điển đúng như lemma của Sudachi (động từ / tính từ ở dạng 〜る / 〜い).
#   readings[].reading: hiragana. readings[].meaning: nghĩa tiếng Việt, chỉ để người biên soạn đọc.
#   readings[].cues: chuỗi con tìm trong cửa sổ quanh từ (câu văn xuôi, cả dòng ở bố cục danh sách — gồm nghĩa in sẵn
#     nên có cue tiếng Việt / Anh, so không phân biệt hoa thường). Cue càng cụ thể càng ít nhầm: ưu tiên cụm có trợ từ
#     ("が開い") hơn một chữ ("開"); tránh cue là chuỗi con của chính term. Cue của cách đọc Sudachi VỐN đã cho chỉ có
#     tác dụng chặn việc đổi (hoà điểm → giữ) nên phải còn cụ thể hơn: "一日に" (cả 一日に三回 lẫn 四月一日に) sẽ chặn
#     nhầm cue "月一日" của ついたち. Tránh danh từ chủ đề đi được với CẢ HAI cách đọc (人気: 公園 / 夜 có cả にんき;
#     今日: 時代 khớp 江戸時代) và cue là chuỗi con của từ thường gặp (大家: 画 ⊂ 計画 / 映画); hai cue lồng nhau của cùng
#     một cách đọc (人気のない ⊃ 人気のな) đếm hai điểm cho một lần xuất hiện → chỉ giữ cue ngắn hơn.
#
# Không đưa vào: cặp khác lemma mà Sudachi đã tách đúng (行う おこなう / 行く いく: 行った mơ hồ thật sự giữa hai động
# từ, không phải hai cách đọc của một từ); từ Sudachi đã đọc theo ngữ cảnh mà bảng không làm tốt hơn. 方: Sudachi chọn
# ほう / かた theo ngữ cảnh khá đúng (この方が便利 ほう, あの方は先生 かた) → chỉ giữ cue かた có trợ từ neo (あの方は,
# あの方が…) cho chỗ nó đọc nhầm (あの方が来ました → ほう); "この方" trần lật nhầm この方が便利 sang かた.

