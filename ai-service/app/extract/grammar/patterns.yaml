# Danh mục mẫu ngữ pháp JLPT (N5–N4, một số N3). Cú pháp `pattern`: xem đầu matcher.py.
# Thứ tự trong file quyết định ưu tiên khi hai mẫu khớp cùng độ dài → mẫu cụ thể đặt trước.

# ---------- Nghĩa vụ / cho phép / cấm ----------
- id: nakereba_naranai
  name: 〜なければならない
  level: N4
  pattern: "ない/助動詞[仮定] ば なる/動詞|いける/動詞|だめ|駄目"
  meaning_vi: "phải làm gì (nghĩa vụ)"
- id: nakute_wa_ikenai
  name: 〜なくてはいけない
  level: N4
  pattern: "ない/助動詞[連用] て は いける/動詞|なる/動詞|だめ|駄目"
  meaning_vi: "phải làm gì (không làm thì không được)"
- id: nai_to_ikenai
  name: 〜ないといけない
  level: N4
  pattern: "ない/助動詞 と/助詞/接続助詞 いける/動詞|だめ|駄目"
  meaning_vi: "phải làm gì"
- id: nakya
  name: 〜なきゃ／なくちゃ
  level: N3
  pattern: "V[未然] ない/助動詞[仮定形-融合]|ない/助動詞[連用形-融合]"
  meaning_vi: "phải làm gì (nói tắt, thân mật)"
- id: nakute_mo_ii
  name: 〜なくてもいい
  level: N4
  pattern: "ない/助動詞[連用] て も いい/形容詞|よい/形容詞|良い/形容詞|構う/動詞|大丈夫"
  meaning_vi: "không cần phải làm gì cũng được"
- id: te_mo_ii
  name: 〜てもいい
  level: N5
  pattern: "* て|で も いい/形容詞|よい/形容詞|良い/形容詞|構う/動詞|大丈夫"
  meaning_vi: "được phép làm gì, làm gì cũng được"
- id: te_wa_ikenai
  name: 〜てはいけない
  level: N5
  pattern: "V[連用]|A[連用] て|で は いける/動詞|なる/動詞|だめ|駄目"
  meaning_vi: "không được làm gì (cấm)"

# ---------- Thể て + động từ bổ trợ ----------
- id: te_iru
