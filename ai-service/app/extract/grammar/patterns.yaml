- id: te_sumimasen
  name: 〜てすみません
  level: N4
  pattern: "V[連用]|ない/助動詞 て|で すみません|すまない/形容詞|申し訳/名詞"
  meaning_vi: "xin lỗi vì đã…"

# ---------- Cho – nhận ----------
- id: sasete_kudasai
  name: 〜させてください
  level: N4
  pattern: "V[未然] せる/助動詞|させる/助動詞 て くださる/動詞"
  meaning_vi: "xin hãy cho phép tôi làm gì"
- id: naide_kudasai
  name: 〜ないでください
  level: N5
  pattern: "ない/助動詞 で くださる/動詞"
  meaning_vi: "xin đừng làm gì"
- id: te_kudasai
  name: 〜てください
  level: N5
  pattern: "V[連用] て|で ください"
  meaning_vi: "hãy làm gì (yêu cầu lịch sự)"
- id: te_itadakemasenka
  name: 〜ていただけませんか
  level: N3
  pattern: "V[連用] て|で いただける/動詞|もらえる/動詞 ます/助動詞? ぬ/助動詞|ん? か/助詞?"
  meaning_vi: "có thể làm giúp tôi… được không? (rất lịch sự)"
- id: te_kureru
  name: 〜てくれる
  level: N4
  pattern: "V[連用] て|で くれる/動詞|くださる/動詞"
  meaning_vi: "ai đó làm gì cho tôi"
- id: te_ageru
  name: 〜てあげる
  level: N4
  pattern: "V[連用] て|で あげる/動詞|やる/動詞|差し上げる/動詞"
  meaning_vi: "làm gì cho ai"
- id: te_morau
  name: 〜てもらう
  level: N4
  pattern: "V[連用] て|で もらう/動詞|いただく/動詞"
  meaning_vi: "được ai làm gì cho"
- id: kureru_ageru_morau
  name: くれる／あげる／もらう
  level: N5
  pattern: "くれる/動詞|あげる/動詞|もらう/動詞|くださる/動詞|いただく/動詞"
  meaning_vi: "cho (tôi) / cho (người khác) / nhận"

# ---------- Kính ngữ cơ bản ----------
- id: o_kudasai
  name: お〜ください
  level: N4
  pattern: "お/接頭辞|ご/接頭辞 V[連用]|/名詞 くださる/動詞"
  meaning_vi: "xin mời / xin hãy… (kính ngữ)"
- id: o_ni_naru
  name: お〜になる
  level: N4
  pattern: "お/接頭辞|ご/接頭辞 V[連用]|/名詞 に なる/動詞"
  meaning_vi: "tôn kính ngữ: ai đó làm gì"
- id: o_suru
  name: お〜する
  level: N4
  pattern: "お/接頭辞|ご/接頭辞 V[連用]|/名詞 する/動詞|いたす/動詞|致す/動詞"
  meaning_vi: "khiêm nhường ngữ: tôi làm gì"

