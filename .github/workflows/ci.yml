# Chặn code hỏng trước khi vào nhánh chung: test backend (Postgres nhúng, không cần Supabase)
# + type-check, lint, build và self-check của frontend + kiểm cú pháp ai-service.
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # selfCheck.ts chạy thẳng file .ts: cần Node tự bỏ type (>= 22.18)
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run selfcheck

  ai-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # Chỉ biên dịch để bắt lỗi cú pháp, không cài thư viện / không chạy service
      - run: python -m compileall -q ai-service/app
